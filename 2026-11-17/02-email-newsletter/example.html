<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example newsletter</title>
<style>
@media only screen and (max-width: 620px) {
  .container { width: 100% !important; }
}
</style>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">Your monthly update is here. Three short stories inside.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f2f2;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff;">
<tr>
<td style="padding:32px 32px 8px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#222222;">
<h1 style="margin:0 0 12px 0; font-family:Arial, Helvetica, sans-serif; font-size:24px; line-height:30px; color:#111111;">Hello from your newsletter</h1>
<p style="margin:0 0 16px 0; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#222222;">This is a short example. Replace the copy with your own.</p>
</td>
</tr>
<tr>
<td style="padding:0;">
<img src="https://example.com/images/hero.png" width="600" alt="A simple line drawing of an open envelope" style="display:block; width:100%; max-width:600px; height:auto; border:0;">
</td>
</tr>
<tr>
<td style="padding:16px 32px 32px 32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px;">
<a href="https://example.com/read" style="color:#0b5cad; text-decoration:underline;">Read the full update</a>
</td>
</tr>
<tr>
<td style="padding:16px 32px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#666666;">
Your business name, 1 Example Street, Sometown VIC 3000<br>
<a href="{{unsubscribeUrl}}" style="color:#666666;">Unsubscribe</a> from this list.
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
